[project]
name = "qwen-image-2-1"
version = "0.1.0"
description = "Qwen-Image-2.1 reproduction and training development"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers",
    "pillow>=12.3.0",
    "torch>=2.4.0",
    "transformers>=5.17",
]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers" }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/qwen_image21"]


[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
ignore = [
  "E501", # line too long - will be fixed in format
]
select = [
    "E4",   # pycodestyle: 基础错误
    "E7",
    "E9",
    "F",    # Pyflakes
    "I",    # 导入排序
    "UP",   # 现代 Python 写法升级
    "B",    # 常见错误模式
    "SIM",  # 简化不必要的复杂表达式
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-local-folder = ["src"]
known-first-party = ["qwen_image21"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
exclude = [
  "**/__pycache__", # cache directories
  "./typings",      # generated type stubs
]
stubPath = "./typings"


[tool.tomlsort]
in_place = true
no_sort_tables = true
spaces_before_inline_comment = 1
spaces_indent_inline_array = 2
trailing_comma_inline_array = true
sort_first = [
  "project",
  "build-system",
  "tool.hatch",
  "tool.uv",
]
