# ============================================================
# Qwen-Image-2.1 训练开发环境
# ============================================================

services:
  qwen-image-dev:
    # --------------------------------------------------------
    # 构建配置
    # --------------------------------------------------------
    build:
      context: .                    # 构建上下文：当前目录
      dockerfile: Dockerfile # Dockerfile 文件名
      args:
        # 构建参数：可在 Dockerfile 中用 ARG 接收
        UV_VERSION: "${UV_VERSION:-0.13.1}"
        PYTHON_VERSION: "${PYTHON_VERSION:-3.11.14}"
        NODE_VERSION: "${NODE_VERSION:-26.8.2}"
        PI_VERSION: "${PI_VERSION:-1.4.0}"
        DOCKER_USERNAME: "${DOCKER_USERNAME:-ubuntu}"
        DOCKER_UID: "${DOCKER_UID:-1000}"
        DOCKER_GID: "${DOCKER_GID:-1000}"

    # --------------------------------------------------------
    # 镜像容器命名
    # --------------------------------------------------------
    image: qwen-image:dev
    ports:
      # 推荐加上双引号，防止 YAML 解析成时间格式
      - "30141:30141" 

    # --------------------------------------------------------
    # 容器命名
    # --------------------------------------------------------
    container_name: qwen_image_dev
    # 固定容器名，方便 docker exec 引用
    # 注意：用了 container_name 就不能 --scale 扩展

    # --------------------------------------------------------
    # GPU 配置
    # --------------------------------------------------------
    # 方式一（旧版）：runtime: nvidia
    # 方式二（推荐）：deploy.resources.reservations.devices
    # 这里用推荐方式，兼容性更好
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all              # 使用所有 GPU
              capabilities: [gpu]     # 声明需要 GPU 能力
        limits:
          # 内存限制：防止训练吃满宿主机
          # 根据机器调整
          memory: 8G          # 给容器 24G，留 3G 给宿主机和 WSL 本身
          cpus: "16.0"         # 限制 16 核，留 4 核给系统

    # --------------------------------------------------------
    # 环境变量，只会注入到容器内部的，不会自注入在宿主机的 shell 中
    # --------------------------------------------------------
    environment:
      # GPU 可见性
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Python 输出无缓冲，日志实时显示
      - PYTHONUNBUFFERED=1
      # 禁用 Python 写 .pyc 文件（避免污染挂载目录）
      - PYTHONDONTWRITEBYTECODE=1
      # 时区（日志时间正确）
      - TZ=Asia/Shanghai
      # PyTorch 编译 缓存目录：TorchInductor、Triton 及相关编译产物
      - TORCHINDUCTOR_CACHE_DIR=/home/${DOCKER_USERNAME}/.cache/torch/inductor
      - TMPDIR=/tmp
      - TEMP=/tmp
      - TMP=/tmp

    # 默认禁止访问外网；需要下载依赖时不要直接移除此限制。
    # network_mode: none

    # --------------------------------------------------------
    # 用户权限
    # --------------------------------------------------------
    # 让容器内用户 UID/GID 与宿主机一致，避免生成的文件在宿主机变成 root 所有
    # user: "${UID:-1000}:${GID:-1000}" Mac/Windows上可能会出错
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"

    # read_only: true：容器根文件系统只读；
    # read_only: true
    # 剥夺该容器内所有进程的 Linux 系统特权（Capabilities），降级为“平民”身份
    # cap_drop:
      # - ALL
    # 禁止容器内进程通过 setuid/setgid 提权，进一步降低安全风险
    security_opt:
      - no-new-privileges:true

    # --------------------------------------------------------
    # 卷挂载
    # --------------------------------------------------------
    volumes:
      # ===== 源码热更新（读写）=====
      - ./src:/workspace/src
      - ./configs:/workspace/configs
      - ./scripts:/workspace/scripts
      - ./tests:/workspace/tests
      - ./docs:/workspace/docs
      - ./pyproject.toml:/workspace/pyproject.toml
      - ./uv.lock:/workspace/uv.lock
      - ./.python-version:/workspace/.python-version
      - ./README.md:/workspace/README.md
      - ./AGENTS.md:/workspace/AGENTS.md
      - ./outputs:/workspace/outputs

      # Git 状态和历史：Pi 需要查看 diff、提交记录等
      - ./.git:/workspace/.git
      - ./.gitignore:/workspace/.gitignore

      # Pi 用户配置、会话和运行状态持久化。
      # 此目录应加入 .gitignore，避免提交凭证。
      - ./.pi:/workspace/.pi

      # Pi 的运行时文件目录，保证 pi 能正常运行：增加一个独立的用户级状态目录
      - ./.pi-runtime:/home/ubuntu/.pi

      # ===== 大资产外挂，训练时可读写，推理时只读=====
      # 【 HF 缓存】预训练权重
      - type: bind
        source: "${MODEL_DIR:?Set MODEL_DIR}"
        target: /home/${DOCKER_USERNAME}/.cache/huggingface
        read_only: false

      # 【 dataset 缓存】
      - type: bind
        source: "${DATASET_DIR:?Set DATASET_DIR}"
        target: /datasets
        read_only: false

      # 【 UV 缓存】所有 Python 项目共用 uv 依赖包
      - type: bind
        source: "${UV_CACHE_DIR:?Set UV_CACHE_DIR}"
        target: /home/${DOCKER_USERNAME}/.cache/uv
        read_only: false
      
      # 【 PyTorch 编译缓存 】：TorchInductor、Triton 及相关编译产物
      - type: bind
        source: "${TORCHINDUCTOR_CACHE_DIR:?Set TORCHINDUCTOR_CACHE_DIR}"
        target: /home/${DOCKER_USERNAME}/.cache/torch/inductor
        read_only: false

    # tmpfs 挂载：标记目录为内存目录（直接分配在内存里，不受只读文件系统限制）
    # 临时缓存会写到容器的 `/tmp` ，避免写入宿主机磁盘（用完即焚，不适合持久化）
    tmpfs:
      # 必须限制 4G，写满了，程序只会报错，不会拖死系统
      - /tmp:size=4G

    # --------------------------------------------------------
    # 工作目录
    # --------------------------------------------------------
    working_dir: /workspace

    # --------------------------------------------------------
    # 网络配置
    # --------------------------------------------------------
    # host 模式：容器直接使用宿主机网络
    # 好处：访问宿主机服务（如 TensorBoard）更方便
    # 注意：Linux 下支持，Windows/Mac 下行为不同
    # network_mode: host

    # --------------------------------------------------------
    # 共享内存
    # --------------------------------------------------------
    # PyTorch DataLoader 多进程需要较大共享内存
    # 默认 64MB 不够，容易报 "Bus error"
    shm_size: "16gb"

    # --------------------------------------------------------
    # 重启策略
    # --------------------------------------------------------
    # 除非手动停止，否则自动重启（开发环境可关闭）
    restart: unless-stopped

    # --------------------------------------------------------
    # 健康检查
    # 当你运行 docker ps 时，STATUS 一栏会显示 Up 2 minutes (healthy) 或 (unhealthy)。你不用进容器，一眼就能看出 GPU 环境是否正常。
    # --------------------------------------------------------
    # healthcheck:
    #   test: ["CMD", "/workspace/.venv/bin/python", "-c", "import torch; assert torch.cuda.is_available()"]
    #   interval: 1800s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 180s

    # --------------------------------------------------------
    # 日志配置
    # --------------------------------------------------------
    logging:
      driver: "json-file"
      options:
        max-size: "50m"       # 单个日志文件最大 50MB
        max-file: "5"         # 最多保留 5 个




# ============================================================
# 使用说明
# ============================================================
#
# 1. 启动：
#    UID=$(id -u) GID=$(id -g) docker compose up -d
#
# 2. 进入容器：
#    docker exec -it qwen_image_dev bash
#
# 3. 在容器内运行训练：
#    cd /workspace
#    uv sync
#    python scripts/train.py --config configs/train.yaml
#
# 4. 查看日志：
#    docker compose logs -f
#
# 5. 停止：
#    docker compose down
#
# 6. 重建镜像（改了 Dockerfile 或依赖）：
#    docker compose build --no-cache
#    docker compose up -d
#
# ============================================================