[project]
name = "qwen-image-2-1"
version = "0.1.0"
description = "Qwen-Image-2.1 reproduction and training development"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers",
    "pillow>=12.3.0",
    "torch>=2.4.0",
    "transformers>=5.17",
]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"